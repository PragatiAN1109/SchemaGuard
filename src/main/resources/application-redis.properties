# Redis connection settings for the 'redis' profile.
# Redis is used ONLY as a KV store — queueing is handled by RabbitMQ.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000ms

# ── Elasticsearch connection ─────────────────────────────────────────────
elastic.host=${ELASTIC_HOST:localhost}
elastic.port=${ELASTIC_PORT:9200}

# ── RabbitMQ connection ──────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}

# ── Google OAuth2 / JWT configuration ────────────────────────────────────
google.client-id=${GOOGLE_CLIENT_ID}
